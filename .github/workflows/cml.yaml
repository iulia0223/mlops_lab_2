name: Model-CI
on: [push, pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  train-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Встановлюємо лише необхідне для навчання та тестів
          pip install --only-binary=:all: numpy pandas scikit-learn pytest matplotlib seaborn joblib
          pip install -r requirements.txt
          # Airflow для тестування DAG-ів
          pip install "apache-airflow==2.7.1" --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.7.1/constraints-3.10.txt"
          # Лінтер
          pip install flake8

      - name: Lint code
        run: |
          flake8 src tests airflow/dags

      - name: Train model
        run: |
          python src/train.py
          echo "Перевірка створених файлів:"
          ls -F
          [ -f metrics.json ] && echo "metrics.json існує" || echo "metrics.json ВІДСУТНІЙ"
          [ -d models ] && ls models/ || echo "папка models ВІДСУТНЯ"

      - name: Run Quality Gate Tests
        env:
          F1_THRESHOLD: "0.70"
        run: |
          pytest tests

      - name: Docker build (ML pipeline image)
        run: |
          docker build -t mlops-lab5 .

      - name: Create Report
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## ML Experiment Results" > report.md
          echo "### Metrics" >> report.md
          echo "\`\`\`json" >> report.md
          cat metrics.json >> report.md
          echo "\`\`\`" >> report.md
          echo "### Visualizations" >> report.md
          echo "![Confusion Matrix](./confusion_matrix.png)" >> report.md
          
          # Використовуємо звичайний коментар через GitHub API замість CML бібліотеки
          curl -X POST -H "Authorization: token $REPO_TOKEN" \
            -d "{\"body\": \"$(cat report.md | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')\"}" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments"