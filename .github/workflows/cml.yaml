name: Model-CI
on: [push, pull_request] # Запускати при кожному пуші або PR

permissions:
  contents: read
  pull-requests: write # Потрібно для того, щоб CML міг писати коментарі

jobs:
  train-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Змінено на 3.10 для кращої сумісності
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Забороняємо компіляцію, беремо тільки готові бінарні збірки
          pip install --only-binary=:all: numpy pandas scikit-learn
          # Встановлюємо решту
          pip install -r requirements.txt
          # Спеціальна установка CML для Linux
          pip install iterative-cml

      - name: Train model
        run: |
          python src/train.py # Запускаємо тренування, яке створює metrics.json та confusion_matrix.png

      - name: Run Quality Gate Tests
        env:
          F1_THRESHOLD: "0.70" # Можна трохи знизити поріг, якщо 0.75 не проходило
        run: |
          pytest tests/test_model.py # Запускаємо ваші тести якості

      - name: Setup CML
        if: github.event_name == 'pull_request'
        uses: iterative/setup-cml@v2
        
      - name: Publish CML Report
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## ML Experiment Results" > report.md
          echo "### Metrics" >> report.md
          echo "\`\`\`json" >> report.md
          cat metrics.json >> report.md
          echo "\`\`\`" >> report.md
          
          echo "### Visualizations" >> report.md
          cml publish confusion_matrix.png --md >> report.md # Завантаження графіку
          
          cml comment create report.md # Публікація коментаря в Pull Request