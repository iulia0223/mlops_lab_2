services:
  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-webserver:
    image: apache/airflow:2.7.1-python3.10
    command: webserver
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - _PIP_ADDITIONAL_REQUIREMENTS=pandas scikit-learn numpy<2.0.0 matplotlib seaborn joblib pytest optuna hydra-core mlflow dvc
      - EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
    volumes:
      - ./dags:/opt/airflow/dags
      - ../:/opt/airflow/project

  airflow-scheduler:
    image: apache/airflow:2.7.1-python3.10
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - _PIP_ADDITIONAL_REQUIREMENTS=pandas scikit-learn numpy<2.0.0 matplotlib seaborn joblib pytest optuna hydra-core mlflow dvc
      - EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./dags:/opt/airflow/dags
      - ../:/opt/airflow/project